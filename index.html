<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Ludd in der Fabrik</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Zilla+Slab:wght@500;700&display=swap">
<style>
/* Layout: one stage (16:9 scene) with caption and controls directly below it, word list underneath. */
:root{
  --bg:#E3E8EB; --panel:#F4F7F8; --fg:#1C2730; --muted:#55636E; --line:#C2CCD2;
  --accent:#A3232B; --accent-fg:#FFFFFF; --flax:#7A5D0E;
  --tag-bg:#F4EFD9; --tag-fg:#1C2730; --stage:#10161B;
  --display:'Zilla Slab',Rockwell,'Roboto Slab',Georgia,serif;
  --body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#12191F; --panel:#1B252D; --fg:#E3E9EC; --muted:#95A4AE; --line:#2F3C46; --accent:#E4666B; --accent-fg:#19090A; --flax:#D9B95F; color-scheme:dark }
}
:root[data-theme="dark"]{ --bg:#12191F; --panel:#1B252D; --fg:#E3E9EC; --muted:#95A4AE; --line:#2F3C46; --accent:#E4666B; --accent-fg:#19090A; --flax:#D9B95F; color-scheme:dark }

body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:1120px;margin-inline:auto;padding-block:20px 40px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 18px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(1.5rem,3.4vw,2.1rem);line-height:1.1;margin:0;text-wrap:balance}
.src{color:var(--muted);font-size:.9rem;margin:0}

.player{display:flex;flex-direction:column;gap:12px;min-width:0}
.stage{position:relative;container-type:inline-size;aspect-ratio:16/9;width:min(100%, max(320px, calc((100vh - 380px) * 16 / 9)));max-width:100%;margin-inline:auto;background:var(--stage);border-radius:4px;overflow:hidden}
.stage canvas{display:block;width:100%;height:100%}
#labs{position:absolute;inset:0;pointer-events:none}
.lab{position:absolute;transform:translate(-50%,-50%);font:600 clamp(8px,1.5cqw,17px)/1.15 var(--body);background:var(--tag-bg);color:var(--tag-fg);padding:.22em .5em;border-radius:3px;white-space:nowrap}

.chapters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chapters button{flex:none;font:500 .85rem var(--body);color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer}
.chapters button[aria-current="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.cap{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px 18px;display:flex;flex-direction:column;gap:4px;min-width:0}
.step{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--flax);font-weight:600;margin:0}
.cap h2{font-family:var(--display);font-weight:700;font-size:1.45rem;line-height:1.15;margin:0}
.cap p.text{margin:4px 0 0;font-size:clamp(1.02rem,1.6vw,1.2rem);line-height:1.5;max-width:68ch;min-height:4.5em}

.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.controls .gap{flex:1 1 20px}
button.btn{font:600 .95rem var(--body);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:9px 14px;cursor:pointer}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);padding-inline:22px}
button.btn[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 -3px 0 var(--flax)}
button.btn:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:3px solid var(--flax);outline-offset:2px}

.words h3{font-family:var(--display);font-size:1.15rem;margin:0 0 8px}
.words dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px 22px;margin:0}
.words div{border-top:1px solid var(--line);padding-top:6px;min-width:0}
.words dt{font-weight:600}
.words dd{margin:0;color:var(--muted);font-size:.92rem}
footer{color:var(--muted);font-size:.85rem;border-top:1px solid var(--line);padding-top:12px;max-width:75ch}

.player:fullscreen{background:var(--bg);padding:16px;justify-content:center}
.player:fullscreen .stage{width:min(100%, calc((100vh - 270px) * 16 / 9));margin-inline:auto}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Ludd in der Fabrik</h1>
    <p class="src">Jonas Lüscher, „Verzauberte Vorbestimmung“, S. 126–128</p>
  </header>

  <div class="player" id="player">
    <nav class="chapters" id="chapters" aria-label="Stationen"></nav>
    <div class="stage">
      <canvas id="cv" aria-label="Animierte Szene"></canvas>
      <div id="labs"></div>
    </div>
    <div class="controls">
      <button class="btn" id="prev">← Zurück</button>
      <button class="btn primary" id="next">Weiter →</button>
      <span class="gap"></span>
      <button class="btn" id="play" aria-pressed="false">Pause</button>
      <button class="btn" id="wordsBtn" aria-pressed="true">Wörter</button>
      <button class="btn" id="soundBtn" aria-pressed="false">Ton</button>
      <button class="btn" id="fsBtn">Vollbild</button>
    </div>
    <div class="cap" aria-live="polite">
      <p class="step" id="step"></p>
      <h2 id="ttl"></h2>
      <p class="text" id="txt"></p>
    </div>
  </div>

  <section class="words" id="words">
    <h3>Wörter zu dieser Station</h3>
    <dl id="wordlist"></dl>
  </section>

  <footer>Die Stationen „Am Abend“, „Der Riemen“ und das Rätsel um das Loch in der Wand folgen einer Zusammenfassung des Kapitels. Alle anderen Stationen folgen dem Auszug S. 126–128.</footer>
</div>

<script>
(()=>{
const W=1600,H=900,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const C={oak:'#8A5A2B',oakD:'#5A3717',oakL:'#B8854C',linen:'#EDE5CF',flax:'#D9B95F',iron:'#4A5A68',ironD:'#1B242C',ironL:'#8496A3',brick:'#8E4B3B',brickD:'#63332A',blood:'#B3202A',thread:'#F3ECD6',leather:'#7A5230',gold:'#F0CF6A'};
const SLAB="'Zilla Slab',Rockwell,Georgia,serif";
const lerp=(a,b,u)=>a+(b-a)*u, clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), ss=x=>{x=clamp(x);return x*x*(3-2*x)}, frac=x=>x-Math.floor(x), rnd=i=>frac(Math.sin(i*127.1+3.7)*43758.5453);
const L2=(a,b,u)=>[lerp(a[0],b[0],u),lerp(a[1],b[1],u)];
function rect(x,y,w,h,f){ctx.fillStyle=f;ctx.fillRect(x,y,w,h)}
function circ(x,y,r,f){ctx.fillStyle=f;ctx.beginPath();ctx.arc(x,y,Math.max(0,r),0,7);ctx.fill()}
function ln(a,b,col,w){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke()}
function poly(p,f,s,w){ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);ctx.closePath();if(f){ctx.fillStyle=f;ctx.fill()}if(s){ctx.strokeStyle=s;ctx.lineWidth=w||2;ctx.lineJoin='round';ctx.stroke()}}
function wheel(x,y,r,a,col,n=6,w){ctx.strokeStyle=col;ctx.lineWidth=w||Math.max(2,r*.16);ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.stroke();ctx.lineWidth=Math.max(1.5,r*.08);for(let i=0;i<n;i++){const q=a+i*Math.PI*2/n;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(q)*r,y+Math.sin(q)*r);ctx.stroke()}circ(x,y,r*.16,col)}
function text(s,x,y,size,col,al='center'){ctx.font=`700 ${size}px ${SLAB}`;ctx.textAlign=al;ctx.textBaseline='middle';ctx.fillStyle=col;ctx.fillText(s,x,y)}
function bricks(x,y,w,h,col='rgba(0,0,0,.22)'){ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();ctx.strokeStyle=col;ctx.lineWidth=2;for(let j=0,yy=y;yy<y+h;yy+=26,j++){ctx.beginPath();ctx.moveTo(x,yy);ctx.lineTo(x+w,yy);ctx.stroke();for(let xx=x+(j%2?0:32);xx<x+w;xx+=64){ctx.beginPath();ctx.moveTo(xx,yy);ctx.lineTo(xx,yy+26);ctx.stroke()}}ctx.restore()}
const mk=(ox,oy,sc,ax,az)=>(X,Y,Z)=>[ox+(X*ax[0]+Z*az[0])*sc,oy+(-Y+X*ax[1]+Z*az[1])*sc];
function along(p,u){let tot=0;const d=[];for(let i=1;i<p.length;i++){const l=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);d.push(l);tot+=l}let r=clamp(u)*tot;for(let i=0;i<d.length;i++){if(r<=d[i])return L2(p[i],p[i+1],d[i]?r/d[i]:0);r-=d[i]}return p[p.length-1]}

/* ---------- labels ---------- */
let words=true,frameLabs=[];const labBox=document.getElementById('labs'),labEls=new Map();
function lab(tx,ax,ay,lx,ly){if(!words)return;frameLabs.push([tx,lx,ly]);ctx.save();ctx.lineCap='round';ctx.strokeStyle='rgba(16,22,27,.7)';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(ax,ay);ctx.stroke();ctx.strokeStyle='#F4EFD9';ctx.lineWidth=2.5;ctx.stroke();circ(ax,ay,8,'rgba(16,22,27,.7)');circ(ax,ay,5.5,'#F4EFD9');ctx.restore()}
function flushLabs(){const seen=new Set();for(const [tx,x,y] of frameLabs){let el=labEls.get(tx);if(!el){el=document.createElement('span');el.className='lab';el.textContent=tx;labBox.appendChild(el);labEls.set(tx,el)}el.hidden=false;el.style.left=(x/W*100)+'%';el.style.top=(y/H*100)+'%';seen.add(tx)}for(const [tx,el] of labEls)if(!seen.has(tx))el.hidden=true;frameLabs=[]}

/* ---------- figures ---------- */
function person(x,y,s,o={}){const c=ctx,col=o.col||C.ironD,sh=o.shirt||col;c.save();c.translate(x,y);c.scale((o.dir||1)*s,s);c.lineCap='round';c.lineJoin='round';let hy=-95;
  if(o.sit){hy=0;c.strokeStyle=col;c.lineWidth=o.skirt?24:14;c.beginPath();c.moveTo(0,0);c.lineTo(44,3);c.lineTo(47,60);c.stroke()}
  else if(o.skirt){poly([[-13,hy],[13,hy],[27,-3],[-27,-3]],col)}
  else{c.strokeStyle=col;c.lineWidth=14;for(const g of[1,-1]){const a=o.walk==null?g*.08:Math.sin(o.walk)*g*.5;c.beginPath();c.moveTo(0,hy);c.lineTo(Math.sin(a)*93,hy+Math.cos(a)*93);c.stroke()}}
  c.translate(0,hy);c.rotate(o.bend||0);
  const arm=(a,cl)=>{a=a||[.06,.12];const ex=Math.sin(a[0])*34,ey=-56+Math.cos(a[0])*34,hx=ex+Math.sin(a[0]+a[1])*32,hY=ey+Math.cos(a[0]+a[1])*32;c.strokeStyle=cl;c.lineWidth=10;c.beginPath();c.moveTo(0,-56);c.lineTo(ex,ey);c.lineTo(hx,hY);c.stroke();return[hx,hY]};
  const hb=arm(o.armB,o.shade||sh);
  c.strokeStyle=sh;c.lineWidth=27;c.beginPath();c.moveTo(0,-6);c.lineTo(0,-56);c.stroke();
  circ(0,-84,16,o.head||col);
  if(o.cap){c.fillStyle=o.cap;c.beginPath();c.arc(0,-88,17,Math.PI,0);c.lineTo(26,-87);c.lineTo(-17,-87);c.fill()}
  if(o.bun)circ(-15,-94,8,o.head||col);
  const ha=arm(o.armA,sh);
  if(o.hold)o.hold(c,ha,hb);
  c.restore()}
const LUDD={col:'#2A2018',shirt:C.linen,shade:'#CFC6AE',head:'#2A2018'};
const WORK={col:'#0E1419',shirt:'#6F7F8B',shade:'#5B6A75',head:'#0E1419'};

/* ---------- loom (hand and power) ---------- */
function loom(ox,oy,sc,c,o={}){const P=mk(ox,oy,sc,[1,0],[.42,-.26]),pw=o.power,F=pw?C.iron:C.oak,FD=pw?'#34424E':C.oakD,Wd=170,TH=250,bw=9*sc;
  const k=Math.floor(c),f=c-k,par=k%2?1:-1,open=ss(f/.15)*(1-ss((f-.88)/.12)),fly=ss((f-.15)/.4),z0=par>0?-22:Wd+22,z1=par>0?Wd+22:-22,shZ=lerp(z0,z1,fly),strike=f>.6&&f<.88?Math.sin(Math.PI*(f-.6)/.28):0,bx=118-44*strike;
  const side=z=>{ln(P(20,0,z),P(20,TH,z),F,bw);ln(P(280,0,z),P(280,TH,z),F,bw);ln(P(20,TH,z),P(280,TH,z),F,bw);ln(P(20,42,z),P(280,42,z),FD,bw*.8)};
  side(Wd);
  for(const X of[20,170,280])ln(P(X,TH,0),P(X,TH,Wd),F,bw);
  let wh=null;
  if(pw){const w=P(322,105,Wd/2);wh=[w[0],w[1],50*sc];if(o.belt){ctx.setLineDash([]);ln([wh[0]-wh[2],wh[1]],[o.belt[0]-22,o.belt[1]],C.leather,8);ln([wh[0]+wh[2],wh[1]],[o.belt[0]+22,o.belt[1]],C.leather,8)}wheel(wh[0],wh[1],wh[2],c*Math.PI*2,C.ironL,6)}
  ln(P(292,112,-6),P(292,112,Wd+6),pw?'#CFC7B0':C.linen,24*sc);
  for(let i=0;i<2;i++){const X=162+i*16,yc=120+(i?1:-1)*par*34*open;poly([P(X,yc-48,0),P(X,yc-48,Wd),P(X,yc+48,Wd),P(X,yc+48,0)],null,F,4*sc);ln(P(X,yc+48,0),P(X,TH,0),FD,1.5*sc);ln(P(X,yc+48,Wd),P(X,TH,Wd),FD,1.5*sc)}
  ctx.globalAlpha*=.85;for(let i=0;i<16;i++){const z=8+i*(Wd-16)/15,yS=120+(i%2?1:-1)*par*34*open,a=P(290,124,z),b=P(170,yS,z),e=P(72,120,z);ctx.strokeStyle=C.thread;ctx.lineWidth=1.3*sc;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.lineTo(e[0],e[1]);ctx.stroke()}ctx.globalAlpha/=.85;
  poly([P(72,120,0),P(72,120,Wd),P(12,120,Wd),P(12,120,0)],C.linen);poly([P(12,120,0),P(12,120,Wd),P(8,84,Wd),P(8,84,0)],'#D6CDB4');
  for(let j=0;j<8;j++){const X=72-(j+frac(c))*8;if(X>13)ln(P(X,120,2),P(X,120,Wd-2),'rgba(120,100,60,.45)',1.2*sc)}
  ln(P(8,80,-6),P(8,80,Wd+6),'#D6CDB4',20*sc);
  ln(P(118,TH,Wd),P(bx,96,Wd),FD,5*sc);
  poly([P(bx,102,0),P(bx,150,0),P(bx,150,Wd),P(bx,102,Wd)],'rgba(240,230,200,.16)',FD,3*sc);
  for(let i=1;i<14;i++){const z=i*Wd/14;ln(P(bx,102,z),P(bx,150,z),pw?'rgba(200,215,225,.6)':'rgba(240,220,170,.6)',1*sc)}
  ln(P(bx,100,-12),P(bx,100,Wd+12),FD,9*sc);
  if(pw)for(const e of[0,1]){const zE=e?Wd+30:-30,launch=(z0>Wd/2)===!!e,kick=launch?Math.sin(Math.PI*clamp((f-.08)/.22))*34:0;ln(P(bx-12,8,zE),P(bx-12,150,zE+(e?-kick:kick)),C.oakL,6*sc)}
  const dz=Math.sign(z1-z0);if(pw&&fly>0&&fly<1)for(let g=4;g>0;g--){ctx.globalAlpha*=.16;ln(P(bx-12,124,shZ-dz*g*22-16),P(bx-12,124,shZ-dz*g*22+16),C.gold,9*sc);ctx.globalAlpha/=.16}
  ln(P(bx-12,124,shZ-16),P(bx-12,124,shZ+16),C.gold,9*sc);
  ln(P(118,TH,0),P(bx,96,0),FD,5*sc);
  side(0);
  return{P,strike,fly,f,bx,wh}}
function weaver(lm,sc,f){const P=lm.P,h=P(-40,90,80);rect(P(-66,0,80)[0],h[1]+8*sc,60*sc,10*sc,C.oakD);ln([h[0]-18*sc,h[1]+14*sc],[h[0]-20*sc,P(0,0,0)[1]],C.oakD,7*sc);ln([h[0]+22*sc,h[1]+14*sc],[h[0]+24*sc,P(0,0,0)[1]],C.oakD,7*sc);
  person(h[0],h[1],sc*.8,{...LUDD,sit:true,bend:.14+.05*lm.strike,armA:[1.5-.45*lm.strike,.35],armB:[1.1+.35*Math.sin(lm.fly*Math.PI),.55]})}

/* ---------- spinning wheel ---------- */
function spinner(t,al){ctx.save();ctx.globalAlpha=al;const run=al>.6?t:0;
  ln([300,800],[300,440],C.oakD,9);ctx.fillStyle=C.flax;ctx.beginPath();ctx.ellipse(300,455,36,66,0,0,7);ctx.fill();for(let i=0;i<14;i++)ln([280+rnd(i)*40,400+rnd(i+9)*100],[278+rnd(i+3)*44,430+rnd(i+5)*90],'rgba(120,95,30,.5)',1.5);
  ln([370,712],[690,688],C.oak,16);ln([390,712],[375,800],C.oak,10);ln([670,690],[690,800],C.oak,10);ln([560,690],[560,620],C.oakD,12);ln([415,706],[415,612],C.oakD,9);
  ctx.strokeStyle='rgba(243,236,214,.7)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(415,598);ctx.lineTo(560,500);ctx.moveTo(415,626);ctx.lineTo(560,740);ctx.stroke();
  wheel(560,620,120,run*1.7,C.oak,10,12);circ(415,612,15,C.oakL);rect(392,602,24,20,C.linen);
  rect(170,696,90,10,C.oakD);ln([182,706],[176,800],C.oakD,8);ln([248,706],[254,800],C.oakD,8);
  const wob=Math.sin(run*2.2)*.08;
  ctx.strokeStyle=C.thread;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(302,505);ctx.lineTo(296,640);ctx.lineTo(398,612);ctx.stroke();
  person(215,690,1.3,{col:'#3B2A33',shirt:'#8F6E5A',shade:'#7A5C4B',head:'#3B2A33',sit:true,skirt:true,bun:true,bend:.1,armA:[1.0+wob,.5],armB:[.75-wob,.9]});
  ctx.restore()}

/* ---------- backgrounds ---------- */
function stube(x0=0,x1=W){ctx.save();ctx.beginPath();ctx.rect(x0,0,x1-x0,H);ctx.clip();rect(0,0,W,H,'#3B2B20');rect(0,780,W,120,'#4E3626');for(let x=0;x<W;x+=130)ln([x,780],[x-60,900],'rgba(0,0,0,.25)',2);rect(0,772,W,10,'#2E2018');ctx.restore()}
function windowLight(x,y){rect(x-10,y-10,220,270,C.oakD);rect(x,y,200,250,'#C9DCE2');ln([x+100,y],[x+100,y+250],C.oakD,8);ln([x,y+125],[x+200,y+125],C.oakD,8);poly([[x,y+250],[x+200,y+250],[x+420,900],[x+60,900]],'rgba(230,220,180,.07)')}
function hallBg(fy=780){rect(0,0,W,H,'#27323C');rect(0,fy,W,H-fy,'#3A4955')}

/* ---------- section view of the hall (shaft, belts, machines) ---------- */
function belt(x,sy,wy,off,run,t){const pr=38,wr=50,TL=L2([x-pr,sy],[x+wr+20,wy-10],off),TR=L2([x+pr,sy],[x+wr+100,wy+72],off);
  const path=()=>{ctx.beginPath();ctx.moveTo(x-wr,wy);ctx.lineTo(TL[0],TL[1]);ctx.quadraticCurveTo((TL[0]+TR[0])/2,Math.min(TL[1],TR[1])-48,TR[0],TR[1]);ctx.lineTo(x+wr,wy);ctx.arc(x,wy,wr,0,Math.PI)};
  ctx.lineJoin='round';ctx.lineCap='butt';ctx.strokeStyle=C.leather;ctx.lineWidth=10;path();ctx.stroke();
  ctx.setLineDash([16,26]);ctx.lineDashOffset=run?-t*260:0;ctx.strokeStyle='rgba(240,210,160,.45)';ctx.lineWidth=4;path();ctx.stroke();ctx.setLineDash([]);return TL}
function section(t,o){const{xs,sy,fy,ww}=o,wy=fy-150;hallBg(fy);
  for(let x=ww+130;x<W;x+=290){ln([x,0],[x,sy-14],C.ironD,10);rect(x-16,sy-22,32,14,C.ironD)}
  rect(0,0,ww,fy,C.brickD);bricks(0,0,ww,fy);rect(ww-8,0,8,fy,'rgba(0,0,0,.3)');

/* ---------- player ---------- */
let si=0,bi=0,T=0,beatT=0,sceneT=0,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,last=0;
const $=id=>document.getElementById(id),chap=$('chapters');
SC.forEach((s,i)=>{const bt=document.createElement('button');bt.textContent=(i+1)+' · '+s.title;bt.onclick=()=>go(i,0);chap.appendChild(bt)});
function go(s,b){const ch=s!==si;si=s;bi=b;beatT=T;if(ch)sceneT=T;ui();if(!playing)frame(0,true)}
function ui(){const s=SC[si];$('step').textContent=`Station ${si+1} von ${SC.length}`+(s.beats.length>1?` · Schritt ${bi+1} von ${s.beats.length}`:'');$('ttl').textContent=s.title;$('txt').textContent=s.beats[bi];
  [...chap.children].forEach((c,i)=>{c.setAttribute('aria-current',i===si?'true':'false')});const cur=chap.children[si];if(cur&&chap.scrollWidth>chap.clientWidth)chap.scrollTo({left:cur.offsetLeft-chap.offsetLeft-40,behavior:'smooth'});
  $('prev').disabled=si===0&&bi===0;$('next').disabled=si===SC.length-1&&bi===s.beats.length-1;
  $('wordlist').innerHTML='';for(const [w,d] of s.words){const x=document.createElement('div'),dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=w;dd.textContent=d;x.append(dt,dd);$('wordlist').appendChild(x)}
  $('words').hidden=!words;$('play').textContent=playing?'Pause':'Abspielen';$('play').setAttribute('aria-pressed',String(!playing))}
function next(){const s=SC[si];if(bi<s.beats.length-1)go(si,bi+1);else if(si<SC.length-1)go(si+1,0)}
function prev(){if(bi>0)go(si,bi-1);else if(si>0)go(si-1,SC[si-1].beats.length-1)}
$('next').onclick=next;$('prev').onclick=prev;
$('play').onclick=()=>{playing=!playing;ui()};
$('wordsBtn').onclick=e=>{words=!words;e.currentTarget.setAttribute('aria-pressed',String(words));ui();if(!playing)frame(0,true)};
$('soundBtn').onclick=e=>{soundOn=!soundOn;if(soundOn){initAudio();if(AC&&AC.state==='suspended')AC.resume()}e.currentTarget.setAttribute('aria-pressed',String(soundOn))};
$('fsBtn').onclick=()=>{const p=$('player');try{if(document.fullscreenElement)document.exitFullscreen();else if(p.requestFullscreen)p.requestFullscreen().catch(()=>{})}catch(e){}};
addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('button')&&e.key===' ')return;if(e.key==='ArrowRight'||e.key==='PageDown'){next();e.preventDefault()}else if(e.key==='ArrowLeft'||e.key==='PageUp'){prev();e.preventDefault()}});
function resize(){const r=cv.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1),w=Math.max(2,Math.round(r.width*d)),h=Math.round(w*9/16);if(cv.width!==w){cv.width=w;cv.height=h;if(!playing)frame(0,true)}}
function frame(now,once){if(!once){const dt=Math.min(.05,(now-last)/1000||0);last=now;if(playing)T+=dt}
  if(playing||once){ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);ctx.globalAlpha=1;ctx.setLineDash([]);SC[si].draw(T,bi,T-beatT);const fa=1-clamp((T-sceneT)/.45);if(fa>0){ctx.globalAlpha=fa;rect(0,0,W,H,'#10161B');ctx.globalAlpha=1}flushLabs()}
  audioTick();if(!once)requestAnimationFrame(frame)}
window.__ludd={go,step:d=>{T+=d;frame(0,true)},pause:()=>{playing=false;ui()}};
new ResizeObserver(resize).observe(cv);resize();ui();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(!playing)frame(0,true)});
frame(0,true);requestAnimationFrame(frame);
})();
</script>
